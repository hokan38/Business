<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="開く扉をモチーフにしたヘッダー">
  <defs>
    <linearGradient id="d-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1120"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <radialGradient id="d-burst" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FBEFCB" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#E2C88A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="d-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8924A"/>
      <stop offset="0.5" stop-color="#E2C88A"/>
      <stop offset="1" stop-color="#B8924A"/>
    </linearGradient>
    <linearGradient id="d-leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141B33"/>
      <stop offset="1" stop-color="#1f2a4d"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#d-sky)"/>

  <!-- light burst from the gap -->
  <ellipse cx="800" cy="330" rx="360" ry="300" fill="url(#d-burst)"/>
  <g stroke="#FBEFCB" stroke-opacity="0.5" stroke-width="1.5">
    <line x1="800" y1="330" x2="800" y2="60"/>
    <line x1="800" y1="330" x2="620" y2="90"/>
    <line x1="800" y1="330" x2="980" y2="90"/>
    <line x1="800" y1="330" x2="540" y2="330"/>
    <line x1="800" y1="330" x2="1060" y2="330"/>
  </g>

  <!-- gate frame -->
  <g fill="none" stroke="url(#d-gold)" stroke-width="4">
    <rect x="576" y="130" width="448" height="400"/>
    <line x1="576" y1="130" x2="1024" y2="130"/>
  </g>

  <!-- left door leaf (opened, in perspective) -->
  <path d="M580 148 L680 176 V500 L580 528 Z" fill="url(#d-leaf)" stroke="url(#d-gold)" stroke-width="3"/>
  <g stroke="#E2C88A" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <rect x="600" y="200" width="58" height="110"/>
    <rect x="600" y="340" width="58" height="130"/>
  </g>
  <circle cx="668" cy="342" r="5" fill="#E2C88A"/>

  <!-- right door leaf (opened, in perspective) -->
  <path d="M1020 148 L920 176 V500 L1020 528 Z" fill="url(#d-leaf)" stroke="url(#d-gold)" stroke-width="3"/>
  <g stroke="#E2C88A" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <rect x="942" y="200" width="58" height="110"/>
    <rect x="942" y="340" width="58" height="130"/>
  </g>
  <circle cx="932" cy="342" r="5" fill="#E2C88A"/>

  <line x1="120" y1="530" x2="1480" y2="530" stroke="#E2C88A" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>

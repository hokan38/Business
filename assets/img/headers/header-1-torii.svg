<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" role="img" aria-label="鳥居をモチーフにしたヘッダー">
  <defs>
    <linearGradient id="t-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a36"/>
      <stop offset="0.55" stop-color="#0A0E1A"/>
      <stop offset="1" stop-color="#070a14"/>
    </linearGradient>
    <radialGradient id="t-glow" cx="50%" cy="70%" r="55%">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#C6A15B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2C88A"/>
      <stop offset="1" stop-color="#A8853F"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="600" fill="url(#t-sky)"/>
  <ellipse cx="800" cy="430" rx="620" ry="360" fill="url(#t-glow)"/>

  <!-- mist lines -->
  <g stroke="#E2C88A" stroke-opacity="0.10" stroke-width="1">
    <line x1="120" y1="300" x2="1480" y2="300"/>
    <line x1="200" y1="360" x2="1400" y2="360"/>
    <line x1="280" y1="418" x2="1320" y2="418"/>
  </g>

  <!-- torii -->
  <g fill="url(#t-gold)">
    <!-- kasagi (top curved beam) -->
    <path d="M560 150 q240 -34 480 0 v20 q-240 -30 -480 0 z"/>
    <rect x="620" y="150" width="360" height="14" opacity="0"/>
    <!-- shimaki small ridge -->
    <path d="M585 178 q215 -26 430 0 v16 q-215 -24 -430 0 z" opacity="0.92"/>
    <!-- nuki (second beam) -->
    <rect x="600" y="238" width="400" height="26" rx="3"/>
    <!-- gakuzuka center tablet -->
    <rect x="782" y="196" width="36" height="46" rx="2"/>
    <!-- left pillar -->
    <path d="M636 264 l-10 236 h34 l-8 -236 z"/>
    <!-- right pillar -->
    <path d="M964 264 l10 236 h-34 l8 -236 z"/>
  </g>

  <!-- base line / ground -->
  <line x1="120" y1="500" x2="1480" y2="500" stroke="#E2C88A" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
